version: '3.8'

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: praktika-uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    environment:
      - UPTIME_KUMA_PORT=3001
    networks:
      - praktika-net

volumes:
  uptime-kuma-data:

networks:
  praktika-net:
    driver: bridge
